global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093



scrape_configs:
  - job_name: kafka
    static_configs:
      - targets:
          - broker1:9404
        labels:
          cluster: source
          broker: broker1

      - targets:
          - broker2:9404
        labels:
          cluster: source
          broker: broker2

      - targets:
          - broker3:9404
        labels:
          cluster: source
          broker: broker3

      - targets:
          - broker-mirror1:9404
        labels:
          cluster: mirror
          broker: broker-mirror1

      - targets:
          - broker-mirror2:9404
        labels:
          cluster: mirror
          broker: broker-mirror2

      - targets:
          - broker-mirror3:9404
        labels:
          cluster: mirror
          broker: broker-mirror3

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
