clusters = source, target
source.bootstrap.servers = broker1:9092,broker2:9092,broker3:9092
target.bootstrap.servers = broker-mirror1:9092

source.security.protocol = SSL
source.ssl.truststore.location = /etc/kafka/secrets/app.truststore.jks
source.ssl.truststore.password = changeit
source.ssl.keystore.location = /etc/kafka/secrets/app.keystore.jks
source.ssl.keystore.password = changeit
source.ssl.key.password = changeit

target.security.protocol = PLAINTEXT

source->target.enabled = true
source->target.topics = shop.products.raw,client.search.requests,client.recommendation.requests
source->target.groups = .*

replication.policy.class = org.apache.kafka.connect.mirror.DefaultReplicationPolicy
sync.topic.acls.enabled = true
sync.topic.configs.enabled = true
emit.heartbeats.enabled = true
emit.checkpoints.enabled = true
refresh.topics.enabled = true
refresh.topics.interval.seconds = 30